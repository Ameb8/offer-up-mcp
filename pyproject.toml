[project]
name = "offerup-local-mcp"
version = "0.1.0"
description = "Free public-page OfferUp search for MCP agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1"]
[project.scripts]
offerup-mcp = "offerup_mcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.hatch.build.targets.wheel]
packages = ["src/offerup_mcp"]
